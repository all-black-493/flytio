name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
    # paths:
    #   - 'backend/**'
    #   - 'terraform/**'
    #   - '.github/scripts/deploy-ec2.sh'
    #   - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
    # paths:
    #   - 'backend/**'
    #   - 'terraform/**'
    #   - '.github/scripts/deploy-ec2.sh'
    #   - '.github/workflows/terraform.yml'

# permissions:
#   id-token: write
#   contents: read

env:
  TF_VAR_key_pair_name: ${{ secrets.KEY_PAIR_NAME }}

jobs:
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # role-session-name: github-actions-terraform-plan
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        run: terraform -chdir=terraform init
        
      - name: Terraform Validate
        run: terraform -chdir=terraform validate
        
      - name: Terraform Plan
        run: terraform -chdir=terraform plan -no-color
        continue-on-error: true

  deploy-infrastructure:
    name: "Deploy Infrastructure"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        run: terraform -chdir=terraform init
        
      - name: Terraform Validate
        run: terraform -chdir=terraform validate
        
      - name: Terraform Plan
        run: terraform -chdir=terraform plan -out=tfplan
        
      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve tfplan

      - name: Wait for Instance Ready
        run: |
          # Retrieve Instance ID using AWS CLI by tag name
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=flyt-africa" "Name=instance-state-name,Values=pending,running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text | head -n 1)
          
          if [ -z "$INSTANCE_ID" ]; then
            echo "Error: Could not find instance with tag Name=flyt-africa"
            exit 1
          fi
          
          echo "Found Instance ID: $INSTANCE_ID"
          echo "Waiting for instance to be ready..."
          aws ec2 wait instance-status-ok --instance-ids $INSTANCE_ID

      - name: Get EC2 IP
        id: get_ip
        run: echo "ec2_public_ip=$(terraform -chdir=terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
    outputs:
      ec2_public_ip: ${{ steps.get_ip.outputs.ec2_public_ip }}

  deploy-app:
    name: "Deploy Application"
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # - name: Checkout code
      #   uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ needs.deploy-infrastructure.outputs.ec2_public_ip }}
          USER: ubuntu
          GH_PAT: ${{ secrets.GH_PAT }}
          # DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_DOMAIN: ${{ secrets.MAIL_DOMAIN }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}

          ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALGORITHM: ${{ secrets.ALGORITHM }}

          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_URL: ${{ secrets.REDIS_URL }}

          DUFFEL_API_TOKEN: ${{ secrets.DUFFEL_API_TOKEN }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}

          PESAPAL_CONSUMER_KEY: ${{ secrets.PESAPAL_CONSUMER_KEY }}
          PESAPAL_CONSUMER_SECRET: ${{ secrets.PESAPAL_CONSUMER_SECRET }}
          PESAPAL_ENV: ${{ secrets.PESAPAL_ENV }}
          PESAPAL_IPN_ID: ${{ secrets.PESAPAL_IPN_ID }}

          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          BACKEND_PUBLIC_URL: ${{ secrets.BACKEND_PUBLIC_URL }}

          COOKIE_DOMAIN: ${{ secrets.COOKIE_DOMAIN }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONCIERGE_MODEL: ${{ secrets.CONCIERGE_MODEL }}

          UNSPLASH_APP_ID: ${{ secrets.UNSPLASH_APP_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}

          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          BLOCKED_USER_AGENTS: ${{ secrets.BLOCKED_USER_AGENTS }}
          AUTO_BAN_DURATION: ${{ secrets.AUTO_BAN_DURATION }}
          AUTO_BAN_THRESHOLD: ${{ secrets.AUTO_BAN_THRESHOLD }}

          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_AUTH_URL: ${{ secrets.GOOGLE_AUTH_URL }}
          GOOGLE_TOKEN_URL: ${{ secrets.GOOGLE_TOKEN_URL }}
          GOOGLE_USERINFO_URL: ${{ secrets.GOOGLE_USERINFO_URL }}

        run: |
          echo "$PRIVATE_KEY" > private_key && chmod 600 private_key

          ssh -o StrictHostKeyChecking=no -o -i private_key ${USER}@${HOST} "

            export DEBIAN_FRONTEND=noninteractive

            if ! command -v docker &> /dev/null; then
                echo 'Docker not found. Installing...'
                sudo apt-get update -y
                sudo apt-get install -y docker.io docker-compose-v2 git
                sudo systemctl start docker
                sudo systemctl enable docker
                sudo usermod -aG docker ubuntu
            fi

            echo 'Debug: Checking permissions...'
            id
            sudo id
            sudo docker info

            run_compose() {
              if docker compose version &> /dev/null; then
                sudo --preserve-env=DOPPLER_TOKEN doppler run -- docker compose "$@"
              else
                sudo --preserve-env=DOPPLER_TOKEN doppler run -- docker-compose "$@"
              fi
            }

            cleanup_docker_disk() {
              echo 'Docker disk usage before cleanup:'
              sudo docker system df || true

              echo 'Cleaning Docker build cache, stopped containers, dangling volumes, and unused images...'
              sudo docker builder prune -af || true
              sudo docker container prune -f || true
              sudo docker volume prune -f || true
              sudo docker image prune -af || true

              echo 'Docker disk usage after cleanup:'
              sudo docker system df || true
              df -h / /var/lib/docker 2>/dev/null || df -h /
            }

            if [ -d 'flytio' ]; then
              echo 'Repo exists, pulling...'
              cd flytio
              git remote set-url origin https://x-access-token:${GH_PAT}@github.com/all-black-493/flytio.git
              git pull origin main
            else
              echo 'Repo missing, cloning...'
              git clone https://x-access-token:${GH_PAT}@github.com/all-black-493/flytio.git
              cd flytio
            fi

            cd backend

            cat<<EOF >.env

            PRIVATE_KEY=${PRIVATE_KEY}
            HOST=${HOST}
            USER=${USER}
            GH_PAT=${GH_PAT}
            RESEND_API_KEY=${RESEND_API_KEY}
            MAIL_DOMAIN=${MAIL_DOMAIN}
            MAIL_FROM_NAME=${MAIL_FROM_NAME}

            ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
            SECRET_KEY=${SECRET_KEY}
            ALGORITHM=${ALGORITHM}

            DATABASE_URL=${DATABASE_URL}
            REDIS_HOST=${REDIS_HOST}
            REDIS_PORT=${REDIS_PORT}
            REDIS_URL=${REDIS_URL}

            DUFFEL_API_TOKEN=${DUFFEL_API_TOKEN}
            CORS_ORIGINS=${CORS_ORIGINS}

            PESAPAL_CONSUMER_KEY=${PESAPAL_CONSUMER_KEY}
            PESAPAL_CONSUMER_SECRET=${PESAPAL_CONSUMER_SECRET}
            PESAPAL_ENV=${PESAPAL_ENV}
            PESAPAL_IPN_ID=${PESAPAL_IPN_ID}

            FRONTEND_URL=${FRONTEND_URL}
            BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL}

            COOKIE_DOMAIN=${COOKIE_DOMAIN}
            COOKIE_SECURE=${COOKIE_SECURE}

            OPENAI_API_KEY=${OPENAI_API_KEY}
            CONCIERGE_MODEL=${CONCIERGE_MODEL}

            UNSPLASH_APP_ID=${UNSPLASH_APP_ID}
            UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY}
            UNSPLASH_SECRET_KEY=${UNSPLASH_SECRET_KEY}

            KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
            BLOCKED_USER_AGENTS=${BLOCKED_USER_AGENTS}
            AUTO_BAN_DURATION=${AUTO_BAN_DURATION}
            AUTO_BAN_THRESHOLD=${AUTO_BAN_THRESHOLD}

            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            GOOGLE_AUTH_URL=${GOOGLE_AUTH_URL}
            GOOGLE_TOKEN_URL=${GOOGLE_TOKEN_URL}
            GOOGLE_USERINFO_URL=${GOOGLE_USERINFO_URL}

            EOF

            if docker compose version &> /dev/null; then
              echo 'Using docker compose v2'
              run_compose down --remove-orphans
              cleanup_docker_disk
              run_compose up -d --build
            else
              echo 'Using legacy docker-compose'
              run_compose down --remove-orphans
              cleanup_docker_disk
              run_compose up -d --build
            fi


            echo '--- Setting up Nginx reverse proxy ---'

            # Install Nginx and Certbot if not present
            if ! command -v nginx &> /dev/null; then
              echo 'Installing Nginx...'
              sudo apt-get update -y
              sudo apt-get install -y nginx
            fi

            if ! command -v certbot &> /dev/null; then
              echo 'Installing Certbot...'
              sudo apt-get install -y certbot python3-certbot-nginx
            fi

            # Write Nginx config for api subdomain
            sudo tee /etc/nginx/sites-available/api.flyt.africa > /dev/null <<'NGINX_CONF'
            server {
                listen 80;
                server_name api.flyt.africa;

                location / {
                    client_max_body_size 2M;
                    proxy_pass http://127.0.0.1:8000;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_read_timeout 300s;
                    proxy_connect_timeout 75s;
                }
            }
            NGINX_CONF

            # Enable the site (idempotent)
            sudo ln -sf /etc/nginx/sites-available/api.flyt.africa /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default

            # Test and reload Nginx
            sudo nginx -t && sudo systemctl reload nginx
            echo 'Nginx is running on port 80'

            # Attempt SSL certificate (non-blocking — will fail gracefully if DNS not ready)
            echo '--- Attempting SSL certificate ---'
            sudo certbot --nginx \
              -d api.flyt.africa \
              --non-interactive \
              --agree-tos \
              --email "${CERTBOT_EMAIL}" \
              --cert-name flyt-africa-api \
              --redirect \
              || echo 'WARNING: Certbot failed. DNS may not be pointing to this server yet. Nginx is still running on HTTP.'

            echo '--- Nginx setup complete ---'
            sudo systemctl status nginx --no-pager

            "
            




         