name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'terraform/**'
      - '.github/scripts/deploy-ec2.sh'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'terraform/**'
      - '.github/scripts/deploy-ec2.sh'
      - '.github/workflows/terraform.yml'

permissions:
  id-token: write
  contents: read

env:
  TF_VAR_key_pair_name: ${{ secrets.KEY_PAIR_NAME }}
  AWS_REGION: us-east-2

jobs:
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-terraform-plan
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        run: terraform -chdir=terraform init
        
      - name: Terraform Validate
        run: terraform -chdir=terraform validate
        
      - name: Terraform Plan
        run: terraform -chdir=terraform plan -no-color
        continue-on-error: true

  deploy-infrastructure:
    name: "Deploy Infrastructure"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-terraform-deploy
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        run: terraform -chdir=terraform init
        
      - name: Terraform Validate
        run: terraform -chdir=terraform validate
        
      - name: Terraform Plan
        run: terraform -chdir=terraform plan -out=tfplan
        
      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve tfplan

      - name: Wait for Instance Ready
        run: |
          # Retrieve Instance ID using AWS CLI by tag name
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=flyt-africa" "Name=instance-state-name,Values=pending,running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text | head -n 1)
          
          if [ -z "$INSTANCE_ID" ]; then
            echo "Error: Could not find instance with tag Name=flyt-africa"
            exit 1
          fi
          
          echo "Found Instance ID: $INSTANCE_ID"
          echo "Waiting for instance to be ready..."
          aws ec2 wait instance-status-ok --instance-ids $INSTANCE_ID

      - name: Get EC2 IP
        id: get_ip
        run: echo "ec2_public_ip=$(terraform -chdir=terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
    outputs:
      ec2_public_ip: ${{ steps.get_ip.outputs.ec2_public_ip }}

  deploy-app:
    name: "Deploy Application"
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # Required: the deploy step reads .github/scripts/deploy-ec2.sh from
      # the runner's workspace and pipes it to the server. Without a
      # checkout that file does not exist and the step dies on stdin.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ needs.deploy-infrastructure.outputs.ec2_public_ip }}
          USER: ubuntu
          GH_PAT: ${{ secrets.GH_PAT }}
          # Bootstrap credentials only - these are what get us TO the
          # environment, so they cannot themselves live in Doppler. Every
          # application secret comes from the Doppler config this token
          # is scoped to.
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

        run: |
          echo "$PRIVATE_KEY" > private_key && chmod 600 private_key

          # `bash -s` with the script on stdin, rather than the script inlined
          # in this file. It cannot be read from the checkout on the server -
          # it is what does the cloning - and piping it avoids an scp round
          # trip. Env vars are named on the remote command line so the runner
          # substitutes them once here; the script itself does no escaping.
          ssh -o StrictHostKeyChecking=no -i private_key "${USER}@${HOST}" \
            "DOPPLER_TOKEN='${DOPPLER_TOKEN}' GH_PAT='${GH_PAT}' bash -s" \
            < .github/scripts/deploy-ec2.sh
