name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
    # paths:
    #   - 'backend/**'
    #   - 'terraform/**'
    #   - '.github/scripts/deploy-ec2.sh'
    #   - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
    # paths:
    #   - 'backend/**'
    #   - 'terraform/**'
    #   - '.github/scripts/deploy-ec2.sh'
    #   - '.github/workflows/terraform.yml'

# permissions:
#   id-token: write
#   contents: read

env:
  TF_VAR_key_pair_name: ${{ secrets.KEY_PAIR_NAME }}

jobs:
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # role-session-name: github-actions-terraform-plan
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        run: terraform -chdir=terraform init
        
      - name: Terraform Validate
        run: terraform -chdir=terraform validate
        
      - name: Terraform Plan
        run: terraform -chdir=terraform plan -no-color
        continue-on-error: true

  deploy-infrastructure:
    name: "Deploy Infrastructure"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        run: terraform -chdir=terraform init
        
      - name: Terraform Validate
        run: terraform -chdir=terraform validate
        
      - name: Terraform Plan
        run: terraform -chdir=terraform plan -out=tfplan
        
      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve tfplan

      - name: Wait for Instance Ready
        run: |
          # Retrieve Instance ID using AWS CLI by tag name
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=flyt-africa" "Name=instance-state-name,Values=pending,running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text | head -n 1)
          
          if [ -z "$INSTANCE_ID" ]; then
            echo "Error: Could not find instance with tag Name=flyt-africa"
            exit 1
          fi
          
          echo "Found Instance ID: $INSTANCE_ID"
          echo "Waiting for instance to be ready..."
          aws ec2 wait instance-status-ok --instance-ids $INSTANCE_ID

      - name: Get EC2 IP
        id: get_ip
        run: echo "ec2_public_ip=$(terraform -chdir=terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
    outputs:
      ec2_public_ip: ${{ steps.get_ip.outputs.ec2_public_ip }}

  deploy-app:
    name: "Deploy Application"
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # - name: Checkout code
      #   uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ needs.deploy-infrastructure.outputs.ec2_public_ip }}
          USER: ubuntu
          GH_PAT: ${{ secrets.GH_PAT }}
          # Bootstrap credentials only. These cannot come from Doppler:
          # they are what gets us TO the environment in the first place -
          # the runner needs AWS to provision, SSH to connect, and a PAT
          # to clone, all before anything can talk to Doppler.
          #
          # A Doppler SERVICE token (dp.st....), read-only and scoped to
          # one project+config. Every application secret now lives there,
          # not here: rotation happens in Doppler, and nothing lands on
          # the server's disk.
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

        run: |
          echo "$PRIVATE_KEY" > private_key && chmod 600 private_key

          ssh -o StrictHostKeyChecking=no -i private_key ${USER}@${HOST} "

          # Without this the remote shell runs every command regardless of
          # failures, and ssh exits with the status of the LAST one - so a
          # failed git pull and a failed image build both reported success
          # because 'systemctl status nginx' at the end happened to work.
          set -e

          export DEBIAN_FRONTEND=noninteractive
          # Single-quoted so the remote shell takes it verbatim - the value
          # is substituted here by the runner, not there.
          export DOPPLER_TOKEN='${DOPPLER_TOKEN}'

          if [ ! -f /swapfile ]; then
            echo 'Creating 2GB swap file...'
            sudo fallocate -l 2G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            echo 'Swap created successfully'
          else
            echo 'Swap already exists'
            sudo swapon /swapfile 2>/dev/null || true
          fi

          free -h

          if ! command -v docker &> /dev/null; then
            echo 'Docker not found. Installing...'
            sudo apt-get update -y
            sudo apt-get install -y docker.io docker-compose-v2 git
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker ubuntu
          fi

          echo 'Debug: Checking permissions...'
          id
          sudo id
          sudo docker info

          if [ -d 'flytio' ]; then
            echo 'Repo exists, pulling...'
            cd flytio
            git remote set-url origin https://x-access-token:${GH_PAT}@github.com/all-black-493/flytio.git
            # Not 'git pull': the checkout had diverged from origin/main, and
            # with no pull strategy configured git refuses outright ('Need to
            # specify how to reconcile divergent branches'). A deploy target
            # has no local work worth keeping, so take origin verbatim.
            git fetch --prune origin main
            git reset --hard origin/main
          else
            echo 'Repo missing, cloning...'
            git clone https://x-access-token:${GH_PAT}@github.com/all-black-493/flytio.git
            cd flytio
          fi

          cd backend

          # No .env is written any more - every application secret comes
          # from Doppler at container start (see backend/docker-entrypoint.sh).
          # Any file left by an earlier deploy is deleted rather than left
          # to rot: it is bind-mounted into the containers, it would still
          # feed Compose's own variable interpolation, and it is exactly the
          # on-disk copy this migration exists to get rid of.
          if [ -f .env ]; then
            echo 'Removing .env left by a pre-Doppler deploy'
            shred -u .env 2>/dev/null || rm -f .env
          fi

          if ! command -v doppler &> /dev/null; then
            echo 'Installing Doppler CLI...'
            curl -sLf --retry 3 --tlsv1.2 --proto '=https' \
              'https://packages.doppler.com/public/cli/install.sh' | sudo sh
          fi

          # Fail here, loudly, rather than four steps later with a container
          # in a restart loop and a green deploy.
          if ! doppler secrets --only-names > /dev/null 2>&1; then
            echo 'ERROR: DOPPLER_TOKEN is missing or invalid - cannot fetch secrets.'
            exit 1
          fi
          echo \"Doppler reachable: \$(doppler secrets --only-names | wc -l) secrets in scope\"

          # The build writes a fresh image layer each deploy and nothing
          # ever removed the old ones, which filled the 16GB root volume
          # ('no space left on device' while extracting a layer). Reclaim
          # before building, not after, so the space is there when needed.
          echo '--- Disk before cleanup ---'
          df -h / | tail -1

          if docker compose version &> /dev/null; then
            echo 'Using docker compose v2'
            sudo env DOPPLER_TOKEN=\"\$DOPPLER_TOKEN\" doppler run -- docker compose down
            # Order matters. An anonymous volume stays 'in use' while any
            # container - even a stopped one - still references it, so
            # pruning volumes before containers reclaims nothing. The
            # .venv mount creates one such volume per build, and they had
            # piled up 24 deep.
            sudo docker container prune -f || true
            # No -a: that would take NAMED volumes too, which includes
            # postgres_data. Without it, only anonymous volumes go.
            sudo docker volume prune -f || true
            sudo docker image prune -af || true
            sudo docker builder prune -af || true
            echo '--- Disk after cleanup ---'
            df -h / | tail -1
            sudo env DOPPLER_TOKEN=\"\$DOPPLER_TOKEN\" doppler run -- docker compose up -d --build
          else
            # Deliberately fatal. This branch predates Doppler and would
            # bring the stack up with no secrets at all - an API that boots
            # and then 500s on every request, behind a green deploy. v1 is
            # also long EOL; install the v2 plugin instead of reviving it.
            echo 'ERROR: docker compose v2 not found. Install docker-compose-v2; the'
            echo '       legacy v1 path cannot inject Doppler secrets.'
            exit 1
          fi

          echo '--- Setting up Nginx reverse proxy ---'

          if ! command -v nginx &> /dev/null; then
            echo 'Installing Nginx...'
            sudo apt-get update -y
            sudo apt-get install -y nginx
          fi

          if ! command -v certbot &> /dev/null; then
            echo 'Installing Certbot...'
            sudo apt-get install -y certbot python3-certbot-nginx
          fi

          sudo tee /etc/nginx/sites-available/api.flyt.africa >/dev/null <<'NGINX_CONF'
          server {
              listen 80;
              server_name api.flyt.africa;

              location / {
                  client_max_body_size 2M;
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_read_timeout 300s;
                  proxy_connect_timeout 75s;
              }
          }
          NGINX_CONF

          sudo ln -sf /etc/nginx/sites-available/api.flyt.africa /etc/nginx/sites-enabled/
          sudo rm -f /etc/nginx/sites-enabled/default

          sudo nginx -t && sudo systemctl reload nginx

          echo 'Nginx is running on port 80'

          echo '--- Attempting SSL certificate ---'

          sudo certbot \
            --nginx \
            -d api.flyt.africa \
            --non-interactive \
            --agree-tos \
            --email \"\$(doppler secrets get CERTBOT_EMAIL --plain)\" \
            --cert-name flyt-africa-api \
            --redirect \
            || echo 'WARNING: Certbot failed. DNS may not be pointing to this server yet.'

          echo '--- Nginx setup complete ---'

          sudo systemctl status nginx --no-pager

          # Prove the API is actually serving before calling this a deploy.
          # nginx and certbot succeeding says nothing about the app: with the
          # containers down, every one of those steps still passes and the
          # site returns 502. Dollar signs below are backslash-escaped so the
          # REMOTE shell expands them, not the runner building this string.
          echo '--- Verifying the API responds ---'
          for i in \$(seq 1 24); do
            if curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:8000/health; then
              echo \"API is up after \${i} attempt(s)\"
              break
            fi
            if [ \${i} -eq 24 ]; then
              echo 'ERROR: API never became healthy - container state and logs:'
              sudo docker compose ps || true
              sudo docker compose logs --tail=60 fastapi-app || true
              exit 1
            fi
            sleep 5
          done

          "