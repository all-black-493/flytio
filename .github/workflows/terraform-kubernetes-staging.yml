name: Provision EKS Staging Infrastructure

# Two jobs, deliberately: `terraform` owns AWS resources, `cluster` owns
# what lives inside the cluster once it exists. Splitting them is what
# lets the second job run only on an apply without repeating the same
# `if:` on a dozen steps.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Staging infrastructure operation
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - replace-certificate
          - destroy
  push:
    branches:
      - main
    paths:
      - "terraform/kubernetes-staging/**"
      - "helm/backend-secrets/**"
      - ".github/workflows/terraform-kubernetes-staging.yml"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/kubernetes-staging/**"
      - "helm/backend-secrets/**"
      - ".github/workflows/terraform-kubernetes-staging.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-kubernetes-staging-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  TF_IN_AUTOMATION: "true"
  TF_DIR: terraform/kubernetes-staging
  # Created by terraform/kubernetes-staging/github_actions.tf. Read-only,
  # and trusted for the pull_request subject that AWS_ROLE_TO_ASSUME is
  # deliberately not - a PR run executes the PR's own copy of this file,
  # so it must not reach a role that can create infrastructure.
  AWS_PLAN_ROLE_ARN: arn:aws:iam::379057358703:role/flyt-backend-staging-github-plan

jobs:
  terraform:
    name: Plan or apply staging infrastructure
    # A pull_request from a fork carries no secrets and no id-token
    # permission, so it could only ever fail at the OIDC assume-role.
    if: >-
      github.repository == 'all-black-493/flytio'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    outputs:
      # Consumed by the `cluster` job below, and republished into a
      # ConfigMap for the deploy workflow - none of which can read
      # Terraform state themselves.
      applied: ${{ steps.apply.outputs.applied }}
      redis_host: ${{ steps.apply.outputs.redis_host }}
      certificate_arn: ${{ steps.apply.outputs.certificate_arn }}
      vpc_cidr: ${{ steps.apply.outputs.vpc_cidr }}

    steps:
      # Before checkout or credentials, so the mistake costs seconds.
      # The role's trust policy accepts refs/heads/main and
      # environment:staging and nothing else, deliberately - there is no
      # wildcard on the ref. Dispatching an apply from another branch
      # therefore spends two minutes in configure-aws-credentials' twelve
      # OIDC retries and then fails with "Not authorized to perform
      # sts:AssumeRoleWithWebIdentity", which reads as a broken role
      # rather than as the branch dropdown that actually caused it.
      - name: Require main for apply and destroy
        if: inputs.operation != '' && inputs.operation != 'plan'
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            exit 0
          fi

          echo "::error title=Dispatch this from main::operation=${OPERATION} was dispatched from ${GITHUB_REF_NAME}, but the AWS role trusts only refs/heads/main - this run cannot authenticate."
          echo "Re-run it against main:"
          echo "  gh workflow run \"Provision EKS Staging Infrastructure\" --ref main -f operation=${OPERATION}"
          echo "Applying from another branch would also apply that branch's Terraform, not main's."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure infrastructure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && env.AWS_PLAN_ROLE_ARN || secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-eks-staging-terraform

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform -chdir="${TF_DIR}" init -input=false

      - name: Check Terraform formatting
        run: terraform -chdir="${TF_DIR}" fmt -check -recursive

      - name: Validate Terraform
        run: terraform -chdir="${TF_DIR}" validate

      # Plan is the default on every trigger. Applying this stack starts an
      # EKS cluster and an ElastiCache replication group that bill by the
      # hour, so it takes a deliberate workflow_dispatch rather than
      # happening as a side effect of merging a comment change. Flip the
      # `if:` on the two steps below to include `github.event_name ==
      # 'push'` to get apply-on-merge instead.
      - name: Plan staging infrastructure
        if: inputs.operation == '' || inputs.operation == 'plan'
        run: terraform -chdir="${TF_DIR}" plan -input=false -no-color

      - name: Apply staging infrastructure
        id: apply
        if: inputs.operation == 'apply' || inputs.operation == 'replace-certificate'
        run: |
          # ACM does not retry a failed issuance - a certificate that hit
          # CAA_ERROR stays FAILED for good, and AWS's own answer is to
          # request a new one. There is no way to do that from a plain
          # apply, because nothing about the resource has changed, so
          # replace-certificate forces the replacement.
          #
          # The new certificate carries a NEW validation record, which has
          # to be added in Cloudflare like the first one - the summary step
          # below prints it. Everything else is a normal apply, which
          # matters: the ARN changes, so the cluster job has to republish
          # the ConfigMap the deploy reads it from.
          replace=()
          if [[ "${{ inputs.operation }}" == "replace-certificate" ]]; then
            replace=(-replace=aws_acm_certificate.api)
          fi

          terraform -chdir="${TF_DIR}" plan -input=false "${replace[@]}" -out=tfplan
          terraform -chdir="${TF_DIR}" apply -input=false -auto-approve tfplan

          {
            echo "applied=true"
            echo "redis_host=$(terraform -chdir="${TF_DIR}" output -raw redis_primary_endpoint)"
            echo "certificate_arn=$(terraform -chdir="${TF_DIR}" output -raw acm_certificate_arn)"
            echo "vpc_cidr=$(terraform -chdir="${TF_DIR}" output -raw vpc_cidr_block)"
          } >> "${GITHUB_OUTPUT}"

      # flyt.africa is on Cloudflare, not Route 53, so nothing here can
      # complete the certificate's DNS validation. Printing the record into
      # the run summary is the difference between a one-minute copy-paste
      # and going to hunt for it in the ACM console.
      - name: Report the certificate validation record
        if: inputs.operation == 'apply' || inputs.operation == 'replace-certificate'
        env:
          CERTIFICATE_ARN: ${{ steps.apply.outputs.certificate_arn }}
        run: |
          # One call, both fields: FailureReason is the only thing that
          # distinguishes "waiting for DNS" from "will never issue".
          read -r state reason < <(aws acm describe-certificate \
            --certificate-arn "${CERTIFICATE_ARN}" \
            --query 'Certificate.[Status,FailureReason]' --output text)
          if [[ "${reason}" == "None" ]]; then
            reason=""
          fi

          # To stdout as well as the summary. A summary renders in the
          # browser and nowhere else, and this is the value that decides
          # whether the ALB can ever come up - so it has to be greppable
          # from the logs rather than only clickable.
          echo "Certificate ${CERTIFICATE_ARN##*/}: ${state}${reason:+ (${reason})}"

          case "${state}" in
            ISSUED) ;;
            FAILED)
              echo "::error title=Certificate will not issue::ACM does not retry a failed issuance. Fix the cause, then re-run this workflow with operation=replace-certificate."
              ;;
            *)
              echo "::warning title=Certificate not issued yet::The ALB cannot attach it until this reads ISSUED, so a deploy will fail on the Ingress."
              ;;
          esac

          {
            echo '### ACM certificate'
            echo
            printf '**Status:** %s\n\n' "${state}"

            if [[ "${state}" != "ISSUED" ]]; then
              echo 'Add this CNAME in Cloudflare (DNS only, not proxied). The'
              echo 'certificate issues within minutes of it resolving, and the'
              echo 'ALB cannot attach it until then.'
              echo
              echo '```'
              terraform -chdir="${TF_DIR}" output -json acm_validation_record |
                jq -r '.[] | "\(.type)  \(.name)  ->  \(.value)"'
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Destroy staging infrastructure
        if: inputs.operation == 'destroy'
        run: terraform -chdir="${TF_DIR}" destroy -input=false -auto-approve

  cluster:
    name: Configure staging cluster
    needs: terraform
    if: needs.terraform.outputs.applied == 'true'
    runs-on: ubuntu-latest

    env:
      EKS_CLUSTER_NAME: flyt-backend-staging
      KUBERNETES_NAMESPACE: flyt-staging
      INFRASTRUCTURE_CONFIG_MAP: backend-infrastructure
      DOPPLER_OPERATOR_NAMESPACE: doppler-operator-system
      DOPPLER_OPERATOR_VERSION: 1.7.1
      DOPPLER_PROJECT: backend
      # stg, never prd. The two configs differ on REDIS_TLS - true here
      # because ElastiCache refuses plaintext, false for the EC2/Compose
      # production deploy - and syncing the wrong one took the site down
      # once already.
      DOPPLER_CONFIG: stg
      SECRETS_RELEASE: flyt-backend-secrets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure infrastructure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-eks-staging-cluster

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Configure staging kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Create the application namespace
        run: |
          kubectl create namespace "${KUBERNETES_NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Publish staging infrastructure configuration
        env:
          REDIS_HOST: ${{ needs.terraform.outputs.redis_host }}
          ACM_CERTIFICATE_ARN: ${{ needs.terraform.outputs.certificate_arn }}
          VPC_CIDR: ${{ needs.terraform.outputs.vpc_cidr }}
        run: |
          # REDIS_HOST, not REDIS_URL: backend/config.py reads
          # REDIS_HOST/REDIS_PORT/REDIS_TLS and assembles the URL itself
          # (Settings.redis_url), so a REDIS_URL published here would be
          # read by nothing. The endpoint changes whenever ElastiCache is
          # recreated and is not secret, so it travels as a ConfigMap
          # rather than through Doppler - the deploy workflow reads it
          # back from here to set the chart's redis.host.
          # The certificate ARN and the VPC range travel the same way and
          # for the same reason: known only to Terraform, needed by a Helm
          # release, and not secret. The deploy role can read this
          # ConfigMap but cannot read Terraform state.
          kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            create configmap "${INFRASTRUCTURE_CONFIG_MAP}" \
            --from-literal="REDIS_HOST=${REDIS_HOST}" \
            --from-literal="ACM_CERTIFICATE_ARN=${ACM_CERTIFICATE_ARN}" \
            --from-literal="VPC_CIDR=${VPC_CIDR}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Cluster-scoped, so it is installed here rather than by helm/backend -
      # see the file's own header for why an application chart must not own
      # it. Idempotent: `apply` on an unchanged pair is a no-op.
      - name: Install the ALB ingress class
        run: kubectl apply -f k8s/staging/ingress-class.yaml

      - name: Install Doppler operator
        run: |
          helm repo add doppler https://helm.doppler.com --force-update
          helm repo update doppler
          helm upgrade --install doppler-operator \
            doppler/doppler-kubernetes-operator \
            --namespace "${DOPPLER_OPERATOR_NAMESPACE}" \
            --create-namespace \
            --version "${DOPPLER_OPERATOR_VERSION}" \
            --wait \
            --timeout 5m

      - name: Configure Doppler authentication
        env:
          DOPPLER_STAGING_TOKEN: ${{ secrets.DOPPLER_STAGING_TOKEN }}
        run: |
          : "${DOPPLER_STAGING_TOKEN:?DOPPLER_STAGING_TOKEN is required - a Doppler service token scoped read-only to backend/stg}"

          # --from-file with /dev/stdin, not --from-literal: the token
          # would otherwise sit in this process's argv.
          printf '%s' "${DOPPLER_STAGING_TOKEN}" |
            kubectl --namespace "${DOPPLER_OPERATOR_NAMESPACE}" \
              create secret generic doppler-token-secret \
              --from-file=serviceToken=/dev/stdin \
              --dry-run=client -o yaml |
            kubectl apply -f -

      - name: Synchronize backend configuration
        run: |
          helm lint helm/backend-secrets --strict \
            --set-string "doppler.project=${DOPPLER_PROJECT}" \
            --set-string "doppler.config=${DOPPLER_CONFIG}" \
            --set-string "managedSecret.namespace=${KUBERNETES_NAMESPACE}"

          # The release lives beside the operator; only the Secret it
          # manages crosses into the application namespace.
          helm upgrade --install "${SECRETS_RELEASE}" helm/backend-secrets \
            --namespace "${DOPPLER_OPERATOR_NAMESPACE}" \
            --set-string "doppler.project=${DOPPLER_PROJECT}" \
            --set-string "doppler.config=${DOPPLER_CONFIG}" \
            --set-string "managedSecret.namespace=${KUBERNETES_NAMESPACE}"

          kubectl --namespace "${DOPPLER_OPERATOR_NAMESPACE}" wait \
            --for=condition=secrets.doppler.com/SecretSyncReady \
            "dopplersecret/${SECRETS_RELEASE}" \
            --timeout=120s

          # Same name as the DopplerSecret - helm/backend's
          # `existingSecret` value, which is what the pods read.
          kubectl --namespace "${KUBERNETES_NAMESPACE}" wait \
            --for=create "secret/${SECRETS_RELEASE}" \
            --timeout=120s

      - name: Diagnose failed configuration
        if: failure()
        run: |
          kubectl --namespace "${DOPPLER_OPERATOR_NAMESPACE}" \
            describe "dopplersecret/${SECRETS_RELEASE}" || true

          kubectl --namespace "${DOPPLER_OPERATOR_NAMESPACE}" logs \
            --selector app.kubernetes.io/name=doppler-kubernetes-operator \
            --all-containers=true \
            --prefix=true \
            --tail=200 || true
