name: Backend image
on:
  push:
    branches: [main]
    # Must match deploy-backend-staging.yml's paths. Every commit that can
    # trigger a deploy has to have an image, and ECR tags are immutable and
    # keyed on the commit - so a release whose push built nothing asks for
    # a tag that will never be pushed.
    #
    # The cost is a rebuild on a chart-only change, producing a second tag
    # with identical content. That is cheap - the layers come from the gha
    # cache - and ecr.tf's lifecycle policy prunes the extras. The
    # alternative, having the deploy resolve some earlier tag, trades a
    # loud failure for the quiet one: shipping code that is not this
    # commit's.
    paths:
      - "backend/**"
      - "helm/backend/**"
      - ".github/workflows/backend-image.yml"
      - ".github/workflows/deploy-backend-staging.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: flyt-backend

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    if: ${{ vars.ECR_ENABLED == 'true' }}
    
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-backend-image

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Deploy it:"
            echo '```'
            echo "helm upgrade --install flyt ./helm/backend \\"
            echo "  --set image.tag=sha-$(git rev-parse --short HEAD)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
