name: Backend image
on:
  # No paths filter, deliberately: every commit on main gets an image.
  #
  # A filter here has to predict which commits might later be deployed, and
  # it cannot. Matching deploy-backend-staging.yml's paths covered pushes
  # and still left every workflow_dispatch of a deploy able to land on a
  # commit with no image - a tag that will never exist, because the build
  # that would have made it already did not run. Twice this was diagnosed
  # as something else, both times after ten minutes of polling.
  #
  # The cost is a build per commit, most of them producing a tag whose
  # content is identical to the last. The layers come from the gha cache,
  # so it is around a minute, and ecr.tf keeps only the 30 newest images.
  # In exchange the invariant needs no maintenance: any commit on main can
  # be deployed, and its image is already there.
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: flyt-backend

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    if: ${{ vars.ECR_ENABLED == 'true' }}
    
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-backend-image

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Deploy it:"
            echo '```'
            echo "helm upgrade --install flyt ./helm/backend \\"
            echo "  --set image.tag=sha-$(git rev-parse --short HEAD)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
