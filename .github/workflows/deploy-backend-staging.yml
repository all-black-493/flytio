name: Deploy Backend to EKS Staging

# Tests, then a Helm release onto the staging cluster.
#
# It does NOT build the image: backend-image.yml already builds and pushes
# `sha-<short>` on the same trigger, and ECR is created with IMMUTABLE
# tags, so a second workflow pushing the same tag fails outright. This one
# waits for that tag to appear instead - which also means a deploy can
# never run against an image that was never published.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "helm/backend/**"
      - ".github/workflows/deploy-backend-staging.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-staging
  cancel-in-progress: false

jobs:
  test:
    name: Test backend
    if: github.repository == 'all-black-493/flytio'
    runs-on: ubuntu-latest

    # Redis only. The suite overrides the session dependency and runs
    # against in-memory SQLite, so DATABASE_URL never has to resolve - but
    # fastapi-guard opens its Redis connection during app startup, and
    # without one every request through the shared TestClient answers 500.
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run backend tests
        # Scoped to this step rather than the workflow, so throwaway
        # credentials cannot reach the deploy job. Every name here exists
        # in backend/config.py - the 11 without a default are what would
        # otherwise fail pydantic validation at import.
        #
        # GUARD_API_KEY is deliberately absent: setting it switches on
        # fastapi-guard's hosted agent (utils/guard.py), which would have
        # CI reporting traffic to api.guard-core.com under a fake key.
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5999/unused
          SECRET_KEY: ci-only-secret-key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          AUTO_BAN_THRESHOLD: "10"
          AUTO_BAN_DURATION: "3600"
          DUFFEL_API_TOKEN: ci-only-duffel-token
          RESEND_API_KEY: ci-only-resend-key
          MAIL_DOMAIN: example.com
          PESAPAL_CONSUMER_KEY: ci-only-consumer-key
          PESAPAL_CONSUMER_SECRET: ci-only-consumer-secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          REDIS_TLS: "false"
          CORS_ORIGINS: http://localhost:3000
          # Defaults to true, and TestClient speaks plain HTTP - a Secure
          # cookie is set but never sent back, so the OAuth state check
          # fails and the callback bounces to ?error=google_auth_failed.
          COOKIE_SECURE: "false"
          # test_oauth.py asserts the login redirect actually points at
          # accounts.google.com, so these need real endpoints rather than
          # placeholders. The client id/secret only have to be non-empty:
          # the token and userinfo calls are monkeypatched, so nothing
          # here reaches Google.
          GOOGLE_CLIENT_ID: ci-only-client-id
          GOOGLE_CLIENT_SECRET: ci-only-client-secret
          GOOGLE_AUTH_URL: https://accounts.google.com/o/oauth2/v2/auth
          GOOGLE_TOKEN_URL: https://oauth2.googleapis.com/token
          GOOGLE_USERINFO_URL: https://www.googleapis.com/oauth2/v2/userinfo
        run: backend/.venv/bin/pytest backend/tests

  deploy:
    name: Deploy to staging
    needs: test
    # Off until the cluster exists. terraform-kubernetes-staging.yml only
    # applies on a deliberate workflow_dispatch, so without this gate every
    # merge would go red at `aws eks update-kubeconfig`.
    if: vars.EKS_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging

    env:
      AWS_REGION: us-east-2
      AWS_STAGING_DEPLOY_ROLE_ARN: arn:aws:iam::379057358703:role/flyt-backend-staging-github-deploy
      EKS_CLUSTER_NAME: flyt-backend-staging
      ECR_REPOSITORY: flyt-backend
      KUBERNETES_NAMESPACE: flyt-staging
      INFRASTRUCTURE_CONFIG_MAP: backend-infrastructure
      HELM_RELEASE: flyt-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure staging AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-eks-staging-deploy

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Await the backend image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          # Same tag backend-image.yml publishes (docker/metadata-action's
          # type=sha,format=short is the first 7 characters). That workflow
          # runs concurrently with this one, so the tag may not exist yet.
          #
          # This holds because backend-image.yml runs on every push to
          # main, with no paths filter - see its own header.
          tag="sha-${GITHUB_SHA:0:7}"

          # On a push that build is running alongside this job, so waiting
          # is the whole point. On a dispatch it ran when the commit
          # landed, or it failed: either way the tag is not going to appear
          # in the next ten minutes, and polling only delays the message.
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            attempts=60
          else
            attempts=1
          fi

          for attempt in $(seq 1 "${attempts}"); do
            if aws ecr batch-get-image \
                 --repository-name "${ECR_REPOSITORY}" \
                 --image-ids "imageTag=${tag}" \
                 --query 'length(images)' \
                 --output text 2>/dev/null | grep -qx 1; then
              echo "Found ${ECR_REPOSITORY}:${tag} after ${attempt} attempt(s)"
              break
            fi

            if [[ "${attempt}" == "${attempts}" ]]; then
              echo "ERROR: ${ECR_REPOSITORY}:${tag} does not exist." >&2
              echo "       Every push to main builds one, so this commit's build failed or" >&2
              echo "       was skipped - check the 'Backend image' workflow, which is gated" >&2
              echo "       on the ECR_ENABLED repository variable." >&2
              echo "       To retry a failed deploy of code that has not changed, re-run the" >&2
              echo "       job rather than dispatching a new one: gh run rerun <id> --failed" >&2
              exit 1
            fi

            sleep 10
          done

          {
            echo "repository=${ECR_REGISTRY}/${ECR_REPOSITORY}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Configure staging kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Resolve staging infrastructure configuration
        id: infrastructure
        run: |
          # Published by terraform-kubernetes-staging.yml. helm/backend's
          # default redis.host is the in-cluster `redis-master` Service,
          # which does not exist here - the chart's values-staging.yaml
          # leaves it unset precisely because only Terraform knows the
          # ElastiCache endpoint.
          configmap="$(kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            get "configmap/${INFRASTRUCTURE_CONFIG_MAP}" \
            --output json)"

          # REDIS_HOST is the ElastiCache endpoint, ACM_CERTIFICATE_ARN the
          # certificate the ALB terminates TLS with, and VPC_CIDR the range
          # uvicorn believes X-Forwarded-For from. All three are known only
          # to Terraform, all three are needed by the chart, and none is a
          # secret - so they come back through the ConfigMap rather than
          # through state this role cannot read.
          for key in REDIS_HOST ACM_CERTIFICATE_ARN VPC_CIDR; do
            value="$(jq -r --arg k "${key}" '.data[$k] // ""' <<<"${configmap}")"

            if [[ -z "${value}" ]]; then
              echo "ERROR: ${INFRASTRUCTURE_CONFIG_MAP} carries no ${key}." >&2
              echo "       Run terraform-kubernetes-staging.yml with operation=apply;" >&2
              echo "       a ConfigMap written before that key existed is the usual cause." >&2
              exit 1
            fi

            echo "${key,,}=${value}" >> "${GITHUB_OUTPUT}"
          done

      - name: Verify the Doppler-managed secret
        run: |
          # helm/backend's `existingSecret`. Its absence would surface as
          # every pod CrashLoopBackOff-ing on pydantic validation, which
          # reads like an application bug rather than missing plumbing.
          kubectl --namespace "${KUBERNETES_NAMESPACE}" wait \
            --for=create secret/flyt-backend-secrets \
            --timeout=120s

      - name: Validate the backend Helm chart
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          REDIS_HOST: ${{ steps.infrastructure.outputs.redis_host }}
          CERTIFICATE_ARN: ${{ steps.infrastructure.outputs.acm_certificate_arn }}
          VPC_CIDR: ${{ steps.infrastructure.outputs.vpc_cidr }}
        run: |
          helm lint helm/backend --strict \
            -f helm/backend/values-staging.yaml \
            --set-string "image.repository=${IMAGE_REPOSITORY}" \
            --set-string "image.tag=${IMAGE_TAG}" \
            --set-string "redis.host=${REDIS_HOST}" \
            --set-string "ingress.certificateArn=${CERTIFICATE_ARN}" \
            --set-string "api.forwardedAllowIps=${VPC_CIDR}"

          helm template "${HELM_RELEASE}" helm/backend \
            --namespace "${KUBERNETES_NAMESPACE}" \
            -f helm/backend/values-staging.yaml \
            --set-string "image.repository=${IMAGE_REPOSITORY}" \
            --set-string "image.tag=${IMAGE_TAG}" \
            --set-string "redis.host=${REDIS_HOST}" \
            --set-string "ingress.certificateArn=${CERTIFICATE_ARN}" \
            --set-string "api.forwardedAllowIps=${VPC_CIDR}" >/dev/null

      - name: Deploy the backend with Helm
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          REDIS_HOST: ${{ steps.infrastructure.outputs.redis_host }}
          CERTIFICATE_ARN: ${{ steps.infrastructure.outputs.acm_certificate_arn }}
          VPC_CIDR: ${{ steps.infrastructure.outputs.vpc_cidr }}
        run: |
          # --wait-for-jobs covers the pre-upgrade migration hook, which
          # gates the rollout: a failed schema change leaves the previous
          # version serving rather than rolling out code it cannot support.
          helm upgrade --install "${HELM_RELEASE}" helm/backend \
            --namespace "${KUBERNETES_NAMESPACE}" \
            -f helm/backend/values-staging.yaml \
            --set-string "image.repository=${IMAGE_REPOSITORY}" \
            --set-string "image.tag=${IMAGE_TAG}" \
            --set-string "redis.host=${REDIS_HOST}" \
            --set-string "ingress.certificateArn=${CERTIFICATE_ARN}" \
            --set-string "api.forwardedAllowIps=${VPC_CIDR}" \
            --reset-values \
            --wait \
            --wait-for-jobs \
            --timeout 10m

      - name: Verify the rollout
        run: |
          kubectl --namespace "${KUBERNETES_NAMESPACE}" rollout status \
            "deployment/${HELM_RELEASE}-api" --timeout=180s

      - name: Smoke test the release
        # The chart's own test Pod: it curls /health/ready THROUGH the
        # Service, so it proves routing and readiness together. Readiness
        # rather than liveness, because /health/live answers 200 from a
        # process whose database is unreachable.
        run: helm test "${HELM_RELEASE}" --namespace "${KUBERNETES_NAMESPACE}" --logs

      - name: Report the public address
        run: |
          # Skipped rather than failed where the chart has no Ingress - the
          # default everywhere but staging.
          if ! kubectl --namespace "${KUBERNETES_NAMESPACE}" \
               get "ingress/${HELM_RELEASE}" >/dev/null 2>&1; then
            echo "This release has no Ingress; nothing to report."
            exit 0
          fi

          # helm returns as soon as the Ingress object is accepted. The ALB
          # behind it is provisioned afterwards by the controller, and its
          # address is empty until that finishes - a minute or two on a
          # first release, immediate on an update.
          if ! kubectl --namespace "${KUBERNETES_NAMESPACE}" wait \
               --for=jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
               "ingress/${HELM_RELEASE}" --timeout=300s; then
            # kubectl only reports that the condition never came true. Why
            # it did not is in the controller's events, and nowhere else.
            #
            # Deduplicated, because the controller retries with backoff and
            # every attempt records the same failure under a fresh
            # RequestID - so the raw list is a dozen copies of one line,
            # and dropping the id is what lets uniq see them as one. Only
            # the newest few survive: an older reason is usually the same
            # problem before the last fix, not a second problem.
            events="$(kubectl --namespace "${KUBERNETES_NAMESPACE}" get events \
              --field-selector "involvedObject.kind=Ingress,involvedObject.name=${HELM_RELEASE}" \
              --sort-by=.lastTimestamp \
              --output 'jsonpath={range .items[*]}{.reason}: {.message}{"\n"}{end}' 2>/dev/null |
              sed -E 's/, RequestID: [0-9a-f-]+//' | awk 'NF && !seen[$0]++' | tail -2)"

            echo "::error title=No load balancer::The Ingress never received an address."
            echo "${events:-(the Ingress has no events)}"
            echo
            echo "The release itself succeeded: the rollout and smoke test above passed."

            case "${events}" in
              *Certificate*)
                echo "ELB reports any certificate it cannot use as UnsupportedCertificate or"
                echo "CertificateNotFound, never as 'not issued yet'. Check the certificate is"
                echo "ISSUED - a CAA record that omits amazon.com blocks issuance - then re-run."
                ;;
            esac
            exit 1
          fi

          address="$(kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            get "ingress/${HELM_RELEASE}" \
            --output 'jsonpath={.status.loadBalancer.ingress[0].hostname}')"
          host="$(kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            get "ingress/${HELM_RELEASE}" \
            --output 'jsonpath={.spec.rules[0].host}')"

          # To stdout as well as the summary: a step summary is readable in
          # the browser and nowhere else - not in the logs, and not through
          # the API - so anything only written there cannot be scripted
          # against or quoted back in a terminal.
          echo "ALB address: ${address}"
          echo "Serving host: ${host}"

          {
            echo '### Public address'
            echo
            printf 'Point **%s** at the load balancer, DNS only (not proxied):\n\n' "${host}"
            echo '```'
            printf 'CNAME  %s  ->  %s\n' "${host%%.*}" "${address}"
            echo '```'
            echo
            echo 'The address changes if the Ingress is deleted and recreated.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Diagnose a failed deployment
        if: failure()
        env:
          SELECTOR: app.kubernetes.io/instance=${{ env.HELM_RELEASE }}
        run: |
          kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            get deployments,pods --output wide || true

          kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            describe "deployment/${HELM_RELEASE}-api" || true

          kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            describe pods --selector "${SELECTOR}" || true

          kubectl --namespace "${KUBERNETES_NAMESPACE}" logs \
            --selector "${SELECTOR}" \
            --all-containers=true \
            --prefix=true \
            --tail=200 \
            --max-log-requests=10 || true

          # hook-delete-policy keeps a FAILED migration Job (and only a
          # failed one), so this is where a blocked schema change shows up.
          kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            describe "job/${HELM_RELEASE}-migrate" || true

          kubectl --namespace "${KUBERNETES_NAMESPACE}" logs \
            --selector "job-name=${HELM_RELEASE}-migrate" \
            --all-containers=true \
            --prefix=true \
            --tail=-1 || true

          kubectl --namespace "${KUBERNETES_NAMESPACE}" \
            get events --sort-by=.lastTimestamp || true
