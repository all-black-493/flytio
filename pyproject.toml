# Vercel build configuration, and the dependency manifest the deploy installs
# from. Not a package that anything imports.
#
# The builder picks ONE dependency source and a pyproject.toml at the build
# root outranks the requirements.txt this repo used to carry, so this file is
# what the deploy installs from. Two things follow, both learned the hard way:
#
#   1. It has to list the whole runtime set. While it named only the queue SDK,
#      the app deployed without FastAPI and every request returned
#      FUNCTION_INVOCATION_FAILED.
#   2. The versions have to be pinned. Declaring the same `>=` ranges as
#      backend/pyproject.toml let the builder resolve fresh at deploy time,
#      which came out 71 packages newer than the tested set - across major
#      bumps like sqlalchemy 2.0 to 2.1 - and dropped greenlet, which async
#      SQLAlchemy needs.
#
# So these are exact pins, generated from backend/uv.lock, which stays the
# source of truth because local dev and CI resolve against it. Regenerate after
# changing dependencies:
#
#   uv export --project backend --no-dev --no-emit-project --no-hashes
#
# backend/tests/test_dependency_manifest.py fails if the two drift.
#
# [[tool.vercel.subscribers]] is not [tool.vercel] entrypoint. The latter is
# how a custom app entrypoint is meant to be named and is not honoured by the
# builder, which is why the app is reached through the top-level main.py. The
# former is read at build time: Vercel imports the module, reads its
# @subscribe registrations, and compiles each into a private queue-triggered
# function with no public URL.

[project]
name = "flyt"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
