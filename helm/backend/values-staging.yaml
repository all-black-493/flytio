# Overrides for the staging EKS cluster built by
# terraform/kubernetes-staging.
#
#   helm upgrade --install flyt ./helm/backend \
#     --namespace flyt-staging --create-namespace \
#     -f helm/backend/values-staging.yaml \
#     --set image.tag=sha-<short sha> \
#     --set redis.host=$(terraform -chdir=terraform/kubernetes-staging output -raw redis_primary_endpoint)
#
# This file exists because the chart's defaults describe a cluster that
# runs its own Redis and its own Kafka - true of k3d, false of EKS. Without
# it, a deploy here starts consumer pods with no broker to talk to and
# points the API at a Redis Service that does not exist.

# The namespace is not set here - Helm takes it from --namespace. It must
# be flyt-staging: the GitHub deploy role's EKS access is scoped to that
# one namespace (terraform/kubernetes-staging/github_actions.tf), so a
# release into `default` is refused with a permissions error that reads
# like a broken kubeconfig.

# redis.host is not set here - it is the ElastiCache endpoint, which only
# exists after `terraform apply`, so it is passed with --set (see above).
# REDIS_TLS belongs in Doppler and must be true: ElastiCache refuses
# plaintext connections.

# --- Event tier -------------------------------------------------------
consumer:
  # Terraform provisions no Kafka, so a consumer would run without a broker
  # and log connection errors while reporting Running. The cost: no
  # cancellation refunds, no notification fan-out, no departure reminders
  # in staging. Turn on once a broker exists.
  enabled: false

# --- HTTP tier --------------------------------------------------------
api:
  autoscaling:
    # Works here, unlike locally: EKS Auto Mode runs metrics-server.
    enabled: true
    minReplicas: 2
    maxReplicas: 6

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

ingress:
  enabled: true

  # Bound to Auto Mode's in-cluster ALB controller by
  # k8s/staging/ingress-class.yaml, which the infrastructure workflow
  # applies. Not nginx: there is no nginx controller on this cluster, and
  # an Ingress naming a class nothing implements just sits there with no
  # address and no event saying why.
  className: alb

  # certificateArn is not set here - it is the ACM certificate's, which
  # exists only after `terraform apply`, so the deploy workflow reads it
  # from the backend-infrastructure ConfigMap and passes it with --set.
  # The same route redis.host takes, and for the same reason.

  hosts:
    # Must match var.api_hostname in terraform/kubernetes-staging: that is
    # the name the certificate is issued for, and a mismatch is a
    # certificate the ALB will not serve for this host.
    #
    # Deliberately not api.flyt.africa, which is production on EC2.
    - host: api-staging.flyt.africa
      paths:
        - path: /
          pathType: Prefix

  annotations:
    # ip, not instance: registers pod addresses directly, so a request
    # reaches the pod that answered the health check rather than being
    # bounced again by kube-proxy - and it is the mode Auto Mode expects,
    # its nodes not being a managed node group with NodePort reachability
    # to lean on.
    alb.ingress.kubernetes.io/target-type: ip

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # Every plain HTTP request redirects to HTTPS. The HTTP listener still
    # has to exist for that to have anywhere to happen, which is why 80 is
    # in listen-ports above.
    alb.ingress.kubernetes.io/ssl-redirect: "443"

    # /health/ready, not the default /. The root route answers 200 from a
    # process whose database is unreachable - exactly the pod this check
    # exists to pull out of rotation. Readiness returns 503 until Postgres
    # and Redis both answer.
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready

    # Longer than the pod's preStopSleepSeconds (5s), so the ALB finishes
    # draining before the container stops accepting connections; shorter
    # than terminationGracePeriodSeconds (30s), so the pod is not killed
    # while the ALB still believes it is draining.
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=15

    # A stable name, so the ALB is identifiable in the console and as the
    # CNAME target in Cloudflare. 32 characters is the AWS limit.
    alb.ingress.kubernetes.io/load-balancer-name: flyt-backend-staging

# api.forwardedAllowIps is not set here either - it is the VPC's CIDR,
# another value only Terraform knows, passed with --set alongside the
# certificate. Without it uvicorn ignores the ALB's X-Forwarded-For and
# fastapi-guard sees the whole internet as one client.

migrations:
  enabled: true
  # The hook gates the whole release, and Neon may be waking from
  # scale-to-zero - cheaper to retry than to fail a deploy that needed a
  # few more seconds.
  backoffLimit: 3
