{{- if .Values.api.autoscaling.enabled }}
{{- /* API only, on purpose. CPU is a reasonable proxy for HTTP load; it
   is a poor one for a Kafka consumer, whose backlog can grow while it
   sits idle on IO. The consumer's ceiling is the partition count, not
   CPU - see deployment-consumer.yaml. */}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "backend.fullname" . }}-api
  labels:
    {{- include "backend.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "backend.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  {{- with .Values.api.autoscaling.behavior }}
  # Without a behavior block the HPA uses a 5-minute scale-down window and
  # scales in as fast as the algorithm allows. For a request-serving tier
  # that means shedding capacity right after a spike subsides and adding it
  # back moments later - flapping that shows up as latency, since every new
  # pod pays a cold start before it is ready.
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  metrics:
    {{- with .Values.api.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .Values.api.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
{{- end }}
