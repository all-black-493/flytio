{{- /*
The HTTP tier. Scales on request load, independently of the consumer -
they are one image but two entirely different workloads, and tying them
together would mean scaling Kafka consumers because HTTP traffic rose.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend.fullname" . }}-api
  labels:
    {{- include "backend.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  # Old ReplicaSets are how `helm rollback`/`kubectl rollout undo` work;
  # 10 of them is more history than anyone reads and more objects than
  # etcd needs.
  revisionHistoryLimit: {{ .Values.api.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the current replica count during a rollout. The
      # app now shuts down gracefully on SIGTERM (uvicorn is PID 1), so a
      # new pod can be serving before an old one goes away.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "backend.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backend.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
      annotations:
        checksum/secret: {{ include "backend.secretChecksum" . }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "backend.serviceAccountName" . }}
      # This workload never calls the Kubernetes API, so mounting a token
      # for it only widens what a compromised process can reach.
      automountServiceAccountToken: false
      {{- include "backend.imagePullSecrets" . | nindent 6 }}
      {{- include "backend.topologySpreadConstraints" (dict "ctx" . "component" "api") | nindent 6 }}
      securityContext:
        {{- include "backend.podSecurityContext" . | nindent 8 }}
      # Long enough for in-flight requests to finish. uvicorn stops
      # accepting new connections on SIGTERM and drains the rest.
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      containers:
        - name: api
          image: {{ include "backend.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "backend.containerSecurityContext" . | nindent 12 }}
          # No command/args: serving is the image's CMD. Migrations are the
          # Job, and the consumer overrides its own - see those templates.
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- include "backend.env" . | nindent 12 }}
          envFrom:
            {{- include "backend.envFrom" . | nindent 12 }}
          # Three probes, three different questions - see routers/health.py.
          #
          # startup gates the other two, so a slow first boot (Neon waking
          # from scale-to-zero) is not mistaken for a wedged process and
          # restarted in a loop.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: {{ .Values.api.startupProbe.failureThreshold }}
          # Restarts the container. Deliberately touches no dependency: a
          # Redis outage must not be read as "this process is broken" and
          # restart every replica at once.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Removes the pod from the Service. Checks the database and Redis,
          # so a pod that cannot serve stops receiving traffic and rejoins
          # by itself when the dependency recovers.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Endpoint removal and SIGTERM are dispatched in PARALLEL, not in
          # order: kube-proxy and the ingress controller can still be
          # routing to this pod at the moment uvicorn stops accepting
          # connections. Measured on a rolling update, that lost 2 requests
          # in 133 with maxUnavailable already at 0.
          #
          # Sleeping here keeps the container serving while that removal
          # propagates. SIGTERM is not sent until preStop returns, so the
          # drain that follows is uncontended. Must stay well below
          # terminationGracePeriodSeconds, which covers preStop AND the
          # drain after it.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.api.preStopSleepSeconds }}"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- include "backend.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "backend.volumes" . | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
