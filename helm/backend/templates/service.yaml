{{- /* API only. The consumer serves no HTTP, which is why the selector
   carries the component label - without it this Service would round-robin
   into consumer pods and half of every request would fail. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "backend.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
