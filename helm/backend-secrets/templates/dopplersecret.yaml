{{- /*
The one resource this chart exists to create.

The operator watches DopplerSecret objects and reconciles a Kubernetes
Secret to match the named Doppler config. Everything else - the CRD, the
controller - belongs to the operator install, not here.

Field names and shapes are taken from the CRD shipped with
doppler-kubernetes-operator 1.7.1
(dopplersecrets.secrets.doppler.com/v1alpha1), not from memory.
*/}}
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: {{ include "backend-secrets.fullname" . }}
  labels:
    {{- include "backend-secrets.labels" . | nindent 4 }}
  {{- if .Values.reloadDeployments }}
  annotations:
    # Opt-in: the operator restarts Deployments that reference this
    # managed Secret when its contents change. helm/backend also rolls on
    # a content checksum at upgrade time, so this is only needed when a
    # rotation must take effect without a deploy.
    secrets.doppler.com/reload: "true"
  {{- end }}
spec:
  tokenSecret:
    name: {{ required "tokenSecret.name is required - create it with kubectl, never in values" .Values.tokenSecret.name }}
    {{- /* The operator defaults to its own namespace when this is unset,
           which is rarely what you want - default to the release's. */}}
    namespace: {{ .Values.tokenSecret.namespace | default .Release.Namespace }}

  managedSecret:
    name: {{ required "managedSecret.name is required - it must match helm/backend's existingSecret" .Values.managedSecret.name }}
    namespace: {{ .Values.managedSecret.namespace | default .Release.Namespace }}
    type: {{ .Values.managedSecret.type }}
    {{- with .Values.managedSecret.annotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.managedSecret.labels }}
    labels:
      {{- toYaml . | nindent 6 }}
    {{- end }}

  project: {{ required "doppler.project is required" .Values.doppler.project }}
  config: {{ required "doppler.config is required" .Values.doppler.config }}
  resyncSeconds: {{ .Values.doppler.resyncSeconds }}
  {{- with .Values.doppler.secrets }}
  {{- /* Absent means "every secret in the config"; an empty list would
         mean "none", so this is omitted rather than rendered empty. */}}
  secrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
