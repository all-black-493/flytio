services:
  fastapi-app:
    build: .
    # depends_on only waits for the containers to *start*, not for
    # Postgres to accept connections, so on a cold boot this can lose the
    # race and exit during init_db/alembic. Without a restart policy it
    # would then stay dead - the API simply never comes up, with a green
    # deploy step.
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # `fastapi dev`/`fastapi run` have their own sys.path auto-detection
      # (triggered by backend/__init__.py existing) that makes `from
      # backend.x import y` resolve everywhere in this codebase - but that
      # magic is specific to the FastAPI CLI. Plain `alembic`, run from
      # WORKDIR /backend, has no such logic and fails with "No module
      # named 'backend'" without this explicitly set.
      - PYTHONPATH=/
    depends_on:
      - db
      - redis
    volumes:
      - .:/backend
      - /backend/.venv
    # init_db runs first: the migration chain cannot build a schema from
    # nothing (see scripts/init_db.py), so against a fresh database
    # Alembic fails on its very first statement and takes the container
    # down with it.
    command: ["sh", "-c", "uv run python -m backend.scripts.init_db && uv run alembic upgrade head && uv run fastapi run main.py --port 80 --host 0.0.0.0"]
    
  kafka-consumer:
    build: .
    # Same race, quieter failure: nothing user-facing breaks immediately,
    # but cancellation refunds and notification fan-out stop happening.
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    volumes:
      - .:/backend
      - /backend/.venv
    command: ["uv", "run", "python", "-m", "backend.workers.kafka_consumer"]

  redis:
    image: redis:latest
    restart: always
    ports:
      - 6379:6379

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_KRAFT_MODE: 'true'
      CLUSTER_ID: 'HDKEKDKEDHKE-23232JD--DSDE4'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker, controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_kraft:/var/lib/kafka/data
    healthcheck:
      test: ["CMD","kafka-topics","--bootstrap-server","localhost:9092","--list"]
      interval: 30s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment: 
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      # Resend's SMTP relay (same account/domain as the app's own
      # transactional email, see backend/utils/email.py) - lets Grafana
      # alert rules actually reach an inbox instead of just failing
      # silently, which is what GF_SMTP_ENABLED=true alone did with no
      # host/credentials underneath it. Pulled from backend/.env via
      # Compose's own variable interpolation, never hardcoded here -
      # this file is checked into git, .env isn't.
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.resend.com:587
      - GF_SMTP_USER=resend
      - GF_SMTP_PASSWORD=${RESEND_API_KEY}
      - GF_SMTP_FROM_ADDRESS=alerts@${MAIL_DOMAIN}
      - GF_SMTP_FROM_NAME=flyt Grafana
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - ./.logs:/.logs:ro
      - promtail_data:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki


volumes:
  postgres_data:
  kafka_kraft:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data: