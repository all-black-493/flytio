# The database is NOT one of these services in any deployed environment:
# it lives in Neon, reached over the network via DATABASE_URL. The `db`
# service below exists only for local development and sits behind the
# `local` profile, so nothing here may `depends_on: db` - a dependency on
# a profiled service makes the whole project invalid ("depends on
# undefined service db") and every compose command fails, not just `up`.
services:
  fastapi-app:
    build: .
    # Neon suspends an idle compute and takes a few seconds to wake, so a
    # cold boot can still lose the race and exit during init_db/alembic.
    # Without a restart policy it would then stay dead - the API simply
    # never comes up, with a green deploy step.
    restart: unless-stopped
    ports:
      # Container port is 8000 now: the image runs unprivileged and cannot
      # bind 80. The host port is unchanged, so nginx still proxies to 8000.
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # Empty locally, where one Postgres serves both purposes; set to
      # Neon's direct (non-pooled) endpoint in deployed environments,
      # because the pooler can't run migrations. See config.py.
      - DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Optional. When set, the entrypoint runs the process under
      # `doppler run` and secrets arrive as environment variables,
      # overriding anything below except the container-topology vars the
      # entrypoint pins. Unset (local dev), everything falls back to .env.
      - DOPPLER_TOKEN=${DOPPLER_TOKEN:-}
      # `fastapi dev`/`fastapi run` have their own sys.path auto-detection
      # (triggered by backend/__init__.py existing) that makes `from
      # backend.x import y` resolve everywhere in this codebase - but that
      # magic is specific to the FastAPI CLI. Plain `alembic`, run from
      # WORKDIR /backend, has no such logic and fails with "No module
      # named 'backend'" without this explicitly set.
      - PYTHONPATH=/
    depends_on:
      redis:
        condition: service_started
      # The Compose equivalent of a Kubernetes init container: the API does
      # not start until migrations have exited 0.
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/backend
      - /backend/.venv
    # No `command:` - the API is this image's CMD (see Dockerfile), so the
    # serve command is defined once. Only the two services below override it.

  # One-shot. Runs the same `python -m backend.scripts.migrate` a Kubernetes
  # init container or Job would, so the schema is prepared in exactly one
  # place regardless of where this is deployed - and exactly once per start,
  # rather than once per replica.
  migrate:
    build: .
    restart: "no"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL:-}
      - DOPPLER_TOKEN=${DOPPLER_TOKEN:-}
      - PYTHONPATH=/
    volumes:
      - .:/backend
      - /backend/.venv
    command: ["python", "-m", "backend.scripts.migrate"]
    
  # Same image as the API, deliberately different process - which is the
  # one reason a `command:` override belongs here rather than in the
  # Dockerfile.
  redis:
    image: redis:latest
    restart: always
    # ports:
    #   - 6379:6379

  # Local development only - deployed environments use Neon and never
  # start this. Behind a profile so `docker compose up` on the server
  # can't accidentally run a second, empty database alongside the real
  # one; bring it up locally with:
  #
  #     docker compose --profile local up -d db
  #
  db:
    image: postgres:17
    container_name: postgres-db
    restart: always
    profiles: ["local"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Bound to loopback, not 0.0.0.0: a published Docker port bypasses
      # UFW entirely, so the previous "5432:5432" would have exposed
      # Postgres to the internet. This form is reachable from a host-run
      # `fastapi dev` and from nowhere else.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
