services:
  fastapi-app:
    build: .
    ports:
      - "8000:80"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # `fastapi dev`/`fastapi run` have their own sys.path auto-detection
      # (triggered by backend/__init__.py existing) that makes `from
      # backend.x import y` resolve everywhere in this codebase - but that
      # magic is specific to the FastAPI CLI. Plain `alembic`, run from
      # WORKDIR /backend, has no such logic and fails with "No module
      # named 'backend'" without this explicitly set.
      - PYTHONPATH=/
    depends_on:
      - db
      - redis
    volumes:
      - .:/backend
      - /backend/.venv
    command: ["sh", "-c", "uv run alembic upgrade head && uv run fastapi dev main.py --port 80 --host 0.0.0.0"]
    
  redis:
    image: redis:latest
    restart: always
    ports:
      - 6379:6379

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: