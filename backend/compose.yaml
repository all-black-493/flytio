# The database is NOT one of these services in any deployed environment:
# it lives in Neon, reached over the network via DATABASE_URL. The `db`
# service below exists only for local development and sits behind the
# `local` profile, so nothing here may `depends_on: db` - a dependency on
# a profiled service makes the whole project invalid ("depends on
# undefined service db") and every compose command fails, not just `up`.
services:
  fastapi-app:
    build: .
    # Neon suspends an idle compute and takes a few seconds to wake, so a
    # cold boot can still lose the race and exit during init_db/alembic.
    # Without a restart policy it would then stay dead - the API simply
    # never comes up, with a green deploy step.
    restart: unless-stopped
    ports:
      # Container port is 8000 now: the image runs unprivileged and cannot
      # bind 80. The host port is unchanged, so nginx still proxies to 8000.
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # Empty locally, where one Postgres serves both purposes; set to
      # Neon's direct (non-pooled) endpoint in deployed environments,
      # because the pooler can't run migrations. See config.py.
      - DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Optional. When set, the entrypoint runs the process under
      # `doppler run` and secrets arrive as environment variables,
      # overriding anything below except the container-topology vars the
      # entrypoint pins. Unset (local dev), everything falls back to .env.
      - DOPPLER_TOKEN=${DOPPLER_TOKEN:-}
      # `fastapi dev`/`fastapi run` have their own sys.path auto-detection
      # (triggered by backend/__init__.py existing) that makes `from
      # backend.x import y` resolve everywhere in this codebase - but that
      # magic is specific to the FastAPI CLI. Plain `alembic`, run from
      # WORKDIR /backend, has no such logic and fails with "No module
      # named 'backend'" without this explicitly set.
      - PYTHONPATH=/
    depends_on:
      redis:
        condition: service_started
      # The Compose equivalent of a Kubernetes init container: the API does
      # not start until migrations have exited 0.
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/backend
      - /backend/.venv
    # No `command:` - the API is this image's CMD (see Dockerfile), so the
    # serve command is defined once. Only the two services below override it.

  # One-shot. Runs the same `python -m backend.scripts.migrate` a Kubernetes
  # init container or Job would, so the schema is prepared in exactly one
  # place regardless of where this is deployed - and exactly once per start,
  # rather than once per replica.
  migrate:
    build: .
    restart: "no"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL:-}
      - DOPPLER_TOKEN=${DOPPLER_TOKEN:-}
      - PYTHONPATH=/
    volumes:
      - .:/backend
      - /backend/.venv
    command: ["python", "-m", "backend.scripts.migrate"]
    
  # Same image as the API, deliberately different process - which is the
  # one reason a `command:` override belongs here rather than in the
  # Dockerfile.
  kafka-consumer:
    build: .
    # Same race, quieter failure: nothing user-facing breaks immediately,
    # but cancellation refunds and notification fan-out stop happening.
    restart: unless-stopped
    environment:
      # Was hardcoded to the local `db` container, which silently pointed
      # this worker at a different database from the API - and at nothing
      # at all once the database moved to Neon. Everything this process
      # owns (refunds on cancellation, notification fan-out, the
      # pre-departure reminder sweep) reads and writes through it.
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Optional. When set, the entrypoint runs the process under
      # `doppler run` and secrets arrive as environment variables,
      # overriding anything below except the container-topology vars the
      # entrypoint pins. Unset (local dev), everything falls back to .env.
      - DOPPLER_TOKEN=${DOPPLER_TOKEN:-}
      - PYTHONPATH=/
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    volumes:
      - .:/backend
      - /backend/.venv
    command: ["python", "-m", "backend.workers.kafka_consumer"]

  redis:
    image: redis:latest
    restart: always
    # ports:
    #   - 6379:6379

  # Local development only - deployed environments use Neon and never
  # start this. Behind a profile so `docker compose up` on the server
  # can't accidentally run a second, empty database alongside the real
  # one; bring it up locally with:
  #
  #     docker compose --profile local up -d db
  #
  db:
    image: postgres:17
    container_name: postgres-db
    restart: always
    profiles: ["local"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Bound to loopback, not 0.0.0.0: a published Docker port bypasses
      # UFW entirely, so the previous "5432:5432" would have exposed
      # Postgres to the internet. This form is reachable from a host-run
      # `fastapi dev` and from nowhere else.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    # ports:
    #   - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_KRAFT_MODE: 'true'
      CLUSTER_ID: 'HDKEKDKEDHKE-23232JD--DSDE4'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker, controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_kraft:/var/lib/kafka/data
    healthcheck:
      test: ["CMD","kafka-topics","--bootstrap-server","localhost:9092","--list"]
      interval: 30s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "127.0.0.1:8080:8080"
    environment: 
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    # ports:
    #   - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      # Resend's SMTP relay (same account/domain as the app's own
      # transactional email, see backend/utils/email.py) - lets Grafana
      # alert rules actually reach an inbox instead of just failing
      # silently, which is what GF_SMTP_ENABLED=true alone did with no
      # host/credentials underneath it. Pulled from backend/.env via
      # Compose's own variable interpolation, never hardcoded here -
      # this file is checked into git, .env isn't.
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.resend.com:587
      - GF_SMTP_USER=resend
      - GF_SMTP_PASSWORD=${RESEND_API_KEY}
      - GF_SMTP_FROM_ADDRESS=alerts@${MAIL_DOMAIN}
      - GF_SMTP_FROM_NAME=flyt Grafana
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    container_name: loki
    # ports:
    #   - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - ./.logs:/.logs:ro
      - promtail_data:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki


volumes:
  postgres_data:
  kafka_kraft:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data: